name: Apply RTM provenance and week narrative

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python .github/scripts/fix_rtm_provenance_and_week_narrative.py
      - name: Validate PHP syntax
        run: |
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Http/Controllers/RpsController.php
      - name: Validate patch markers
        run: |
          grep -q "RTM manual tetap dipertahankan" app/Services/Rps/RpsAssessmentSyncService.php
          grep -q "syncWeeklySubCpmkNarratives" app/Services/Rps/RpsAssessmentSyncService.php
          grep -q "normalizeWeekSubCpmkNarrative" app/Http/Controllers/RpsController.php
      - name: Frontend build
        env:
          VERCEL: '1'
        run: |
          npm ci
          npm run build
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/fix_rtm_provenance_and_week_narrative.py
          rm -f .github/workflows/apply-rtm-provenance-week-narrative.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep RTM provenance and weekly Sub-CPMK narrative aligned"
          git push
