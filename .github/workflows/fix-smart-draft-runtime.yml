name: Fix Smart Draft Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch service
        shell: bash
        run: |
          python3 .github/scripts/fix_smart_draft_runtime.py
          php -l app/Services/Rps/RpsSmartDraftService.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Rps/RpsSmartDraftService.php
          if ! git diff --cached --quiet; then
            git commit -m "Harden automatic RPS completion on production"
            git push
          fi
