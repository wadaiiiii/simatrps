name: Normalize Pekan terminology

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/normalize-pekan-terminology.py'
      - '.github/workflows/normalize-pekan-terminology.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize terminology
        run: python .github/scripts/normalize-pekan-terminology.py
      - name: Validate PHP syntax
        run: |
          find app -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          tail -n 20 /tmp/php-lint.txt
      - name: Validate frontend markers
        run: |
          grep -q 'PEKAN KE-' resources/js/pages/rps/show.tsx
          grep -q '>Pekan</th>' resources/js/pages/rps/show.tsx
          ! grep -q 'DUE / MINGGU' resources/js/pages/rps/show.tsx
      - name: Commit implementation and cleanup
        run: |
          rm .github/scripts/normalize-pekan-terminology.py
          rm .github/workflows/normalize-pekan-terminology.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Standardize Pekan terminology across RPS workspace"
          git push
