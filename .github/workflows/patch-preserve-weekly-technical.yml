name: Patch Preserve Weekly Technical Workload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-preserve-weekly-technical.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested weekly clear behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('app/Http/Controllers/RpsAutomationController.php')
          text = controller.read_text()
          old = """                'assessment_indicator' => null,
                'assessment_criteria' => null,
                'assessment_method' => null,
                'learning_form' => null,
                'learning_method' => null,
                'face_to_face_sessions' => 0,
                'learning_activity' => null,
                'independent_study_sessions' => 0,
                'student_assignment' => null,
                'structured_task_sessions' => 0,
                'online_activity' => null,
                'material_text' => null,
                'reference_text' => null,
                'time_estimate' => null,
"""
          new = """                'assessment_indicator' => null,
                'assessment_criteria' => null,
                'assessment_method' => null,
                'learning_method' => null,
                'learning_activity' => null,
                'online_activity' => null,
                'material_text' => null,
                'reference_text' => null,
"""
          if old not in text:
              raise SystemExit('Expected clearWeeklyContent field block not found')
          text = text.replace(old, new, 1)
          old_msg = '"Isi {$updated} pekan pembelajaran dikosongkan. Alokasi Sub-CPMK, bobot, UTS/UAS, Asesmen Detail, dan RTM tetap dipertahankan."'
          new_msg = '"Isi {$updated} pekan pembelajaran dikosongkan. Tatap muka, belajar mandiri, tugas mandiri/terstruktur, alokasi Sub-CPMK, bobot, UTS/UAS, Asesmen Detail, dan RTM tetap dipertahankan."'
          if old_msg not in text:
              raise SystemExit('Expected clearWeeklyContent success message not found')
          text = text.replace(old_msg, new_msg, 1)
          controller.write_text(text)

          ui = Path('resources/js/pages/rps/show.tsx')
          text = ui.read_text()

          text = text.replace('Lengkapi Data Teknis', 'Isi Data Teknis')
          text = text.replace('Isi Bagian Kosong', 'Isi Data Teknis')
          text = text.replace('Kosongkan Isi Pekanan', 'Kosongkan Isi')

          old_confirm = "if (!confirm('Kosongkan seluruh isi akademik 14 pekan pembelajaran? Alokasi Sub-CPMK, bobot, UTS/UAS, Asesmen Detail, dan RTM tetap dipertahankan.')) return;"
          new_confirm = "if (!confirm('Kosongkan isi akademik 14 pekan pembelajaran? Tatap muka, belajar mandiri, tugas mandiri/terstruktur, alokasi Sub-CPMK, bobot, UTS/UAS, Asesmen Detail, dan RTM tetap dipertahankan.')) return;"
          if old_confirm not in text:
              raise SystemExit('Expected toolbar clear confirmation not found')
          text = text.replace(old_confirm, new_confirm, 1)

          old_notice = "actionOptions('Isi pekanan dikosongkan. Alokasi Sub-CPMK, bobot, UTS/UAS, Asesmen Detail, dan RTM tetap dipertahankan.'),"
          new_notice = "actionOptions('Isi pekanan dikosongkan. Tatap muka, belajar mandiri, tugas mandiri/terstruktur, alokasi Sub-CPMK, bobot, UTS/UAS, Asesmen Detail, dan RTM tetap dipertahankan.'),"
          if old_notice not in text:
              raise SystemExit('Expected toolbar clear notice not found')
          text = text.replace(old_notice, new_notice, 1)

          old_title = "title={meetingPlanReady ? 'Reset isi akademik pekanan tanpa menghapus struktur penilaian' : 'Selesaikan Atur Pertemuan terlebih dahulu.'}"
          new_title = "title={meetingPlanReady ? 'Kosongkan isi akademik tanpa mereset tatap muka, belajar mandiri, tugas mandiri/terstruktur, atau struktur penilaian' : 'Selesaikan Atur Pertemuan terlebih dahulu.'}"
          if old_title not in text:
              raise SystemExit('Expected toolbar clear title not found')
          text = text.replace(old_title, new_title, 1)

          old_week_confirm = "if (!confirm(`Kosongkan isi Pekan ${week.week_number}? Sub-CPMK dan bobot penilaian tetap dipertahankan.`)) {"
          new_week_confirm = "if (!confirm(`Kosongkan isi Pekan ${week.week_number}? Tatap muka, belajar mandiri, tugas mandiri/terstruktur, Sub-CPMK, dan bobot penilaian tetap dipertahankan.`)) {"
          if old_week_confirm not in text:
              raise SystemExit('Expected per-week clear confirmation not found')
          text = text.replace(old_week_confirm, new_week_confirm, 1)

          old_form = """            rps_sub_cpmk_id: form.data.rps_sub_cpmk_id,
            assessment_indicator: '',
            assessment_criteria: '',
            assessment_method: '',
            learning_form: '',
            learning_method: '',
            face_to_face_sessions: '0',
            learning_activity: '',
            independent_study_sessions: '0',
            student_assignment: '',
            structured_task_sessions: '0',
            online_activity: '',
            material_text: '',
            reference_text: '',
            time_estimate: '',
"""
          new_form = """            rps_sub_cpmk_id: form.data.rps_sub_cpmk_id,
            assessment_indicator: '',
            assessment_criteria: '',
            assessment_method: '',
            learning_form: form.data.learning_form,
            learning_method: '',
            face_to_face_sessions: form.data.face_to_face_sessions,
            learning_activity: '',
            independent_study_sessions: form.data.independent_study_sessions,
            student_assignment: form.data.student_assignment,
            structured_task_sessions: form.data.structured_task_sessions,
            online_activity: '',
            material_text: '',
            reference_text: '',
            time_estimate: form.data.time_estimate,
"""
          if old_form not in text:
              raise SystemExit('Expected per-week clear form block not found')
          text = text.replace(old_form, new_form, 1)

          old_week_notice = "`Isian Pekan ${week.week_number} dikosongkan di editor. Klik Simpan untuk menyimpan perubahan.`,"
          new_week_notice = "`Isi akademik Pekan ${week.week_number} dikosongkan di editor. Data tatap muka, belajar mandiri, dan tugas mandiri/terstruktur tetap. Klik Simpan untuk menyimpan perubahan.`,"
          if old_week_notice not in text:
              raise SystemExit('Expected per-week clear notice not found')
          text = text.replace(old_week_notice, new_week_notice, 1)

          ui.write_text(text)
          PY

      - name: Verify changes
        shell: bash
        run: |
          php -l app/Http/Controllers/RpsAutomationController.php
          grep -q "Isi Data Teknis" resources/js/pages/rps/show.tsx
          grep -q "Kosongkan Isi" resources/js/pages/rps/show.tsx
          ! grep -q "Kosongkan Isi Pekanan" resources/js/pages/rps/show.tsx
          ! grep -q "Lengkapi Data Teknis" resources/js/pages/rps/show.tsx
          grep -q "face_to_face_sessions: form.data.face_to_face_sessions" resources/js/pages/rps/show.tsx
          grep -q "student_assignment: form.data.student_assignment" resources/js/pages/rps/show.tsx
          grep -q "structured_task_sessions: form.data.structured_task_sessions" resources/js/pages/rps/show.tsx

      - name: Commit requested changes and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-preserve-weekly-technical.yml
          git add app/Http/Controllers/RpsAutomationController.php resources/js/pages/rps/show.tsx
          git commit -m "Preserve weekly technical workload when clearing content"
          git push origin HEAD:main
