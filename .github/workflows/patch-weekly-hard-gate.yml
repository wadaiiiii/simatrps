name: Patch Weekly Material Decision

on:
  push:
    paths:
      - '.github/scripts/patch-weekly-material-decision.py'
      - '.github/workflows/patch-weekly-hard-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch-weekly-material-decision.py

      - name: Verify PHP and markers
        run: |
          php -l app/Services/Rps/ObeWorkspaceService.php
          php -l app/Http/Controllers/RpsValidatorDecisionController.php
          grep -q "weekly_material_semantics" app/Http/Controllers/RpsValidatorDecisionController.php
          grep -q "weekly-material:week:" app/Services/Rps/ObeWorkspaceService.php
          grep -q "Lanjut (Tidak Ikut Rekomendasi)" resources/js/pages/rps/show.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Rps/ObeWorkspaceService.php app/Http/Controllers/RpsValidatorDecisionController.php resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Allow lecturer to keep weekly material decisions"
            git push origin HEAD:main
          fi
