name: Patch Weekly Hard Gate

on:
  push:
    paths:
      - '.github/scripts/patch-weekly-hard-gate.py'
      - '.github/workflows/patch-weekly-hard-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-weekly-hard-gate.py
      - name: Verify PHP and markers
        run: |
          php -l app/Http/Controllers/RpsAutomationController.php
          grep -q "meetingPlanReady" resources/js/pages/rps/show.tsx
          grep -q "Isi Data Teknis" resources/js/pages/rps/show.tsx
          grep -q "Kosongkan Isi" resources/js/pages/rps/show.tsx
          ! grep -q "Kosongkan Isi Pekanan" resources/js/pages/rps/show.tsx
          ! grep -q "Lengkapi Data Teknis" resources/js/pages/rps/show.tsx
          ! grep -q "Isi Bagian Kosong" resources/js/pages/rps/show.tsx
          grep -q "face_to_face_sessions: form.data.face_to_face_sessions" resources/js/pages/rps/show.tsx
          grep -q "independent_study_sessions: form.data.independent_study_sessions" resources/js/pages/rps/show.tsx
          grep -q "student_assignment: form.data.student_assignment" resources/js/pages/rps/show.tsx
          grep -q "structured_task_sessions: form.data.structured_task_sessions" resources/js/pages/rps/show.tsx
          grep -q "time_estimate: form.data.time_estimate" resources/js/pages/rps/show.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAutomationController.php resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Preserve weekly technical workload when clearing content"
            git push
          fi
