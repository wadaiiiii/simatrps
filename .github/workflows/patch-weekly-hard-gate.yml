name: Patch Integrative RTM

on:
  push:
    paths:
      - '.github/scripts/patch-integrative-rtm.py'
      - '.github/workflows/patch-weekly-hard-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          sed -i 's/re.subn(pattern, replacement, text, count=1, flags=re.S)/re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)/' .github/scripts/patch-integrative-rtm.py
          python .github/scripts/patch-integrative-rtm.py

      - name: Verify PHP and markers
        run: |
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Http/Controllers/RpsTaskController.php
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Services/Rps/ObeWorkspaceService.php
          php -l app/Services/Rps/AiRpsProviderService.php
          grep -q "ATURAN CAKUPAN RTM" app/Http/Controllers/RpsAiController.php
          grep -q "RTM dapat mengukur sebagian atau seluruh Sub-CPMK asesmen" app/Services/Rps/RpsAssessmentSyncService.php
          grep -q "Pekan pengumpulan hanya jadwal" app/Http/Controllers/RpsController.php
          grep -q "RTM hanya boleh mengukur Sub-CPMK" app/Http/Controllers/RpsTaskController.php
          grep -q "Satu RTM dapat mengukur satu atau lebih Sub-CPMK" resources/js/pages/rps/show.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAiController.php app/Http/Controllers/RpsController.php app/Http/Controllers/RpsTaskController.php app/Services/Rps/RpsAssessmentSyncService.php app/Services/Rps/ObeWorkspaceService.php app/Services/Rps/AiRpsProviderService.php app/Services/Rps/*RpsService.php resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Support detailed integrative multi-Sub-CPMK RTM"
            git push origin HEAD:main
          fi
