name: Patch controlled weekly weight and RTM

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-controlled-weekly-weight-and-rtm.py'
      - '.github/workflows/patch-controlled-weekly-weight-and-rtm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled weekly weight and RTM patch
        run: python .github/scripts/patch-controlled-weekly-weight-and-rtm.py

      - name: Validate PHP syntax
        run: |
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Http/Controllers/RpsDocumentController.php
          php -l app/Services/Rps/ObeWorkspaceService.php

      - name: Validate frontend markers
        run: |
          grep -q "Bobot asesmen agregat tidak berubah" resources/js/pages/rps/show.tsx
          grep -q "assessment_weight_editable" resources/js/pages/rps/show.tsx
          grep -q "PEKAN KE-" resources/js/pages/rps/show.tsx

      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/patch-controlled-weekly-weight-and-rtm.py
          rm -f .github/workflows/patch-controlled-weekly-weight-and-rtm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Rps/RpsAssessmentSyncService.php app/Http/Controllers/RpsController.php app/Http/Controllers/RpsDocumentController.php app/Services/Rps/ObeWorkspaceService.php resources/js/pages/rps/show.tsx .github/scripts .github/workflows
          git commit -m "Control weekly weight edits and complete required RTM"
          git push origin main
