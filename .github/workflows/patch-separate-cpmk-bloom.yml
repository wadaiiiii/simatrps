name: Separate CPMK Bloom Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-separate-cpmk-bloom.yml'
      - '.github/scripts/patch-separate-cpmk-bloom.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-separate-cpmk-bloom.py

      - name: Run focused checks
        run: |
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Services/Rps/RpsAiContextService.php
          grep -q 'Pemetaan Bloom AI' resources/js/pages/rps/show.tsx
          grep -q "'bloom_mapping'" app/Http/Controllers/RpsAiController.php

      - name: Commit patch
        run: |
          git config user.name "SiMatRPS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/Http/Controllers/RpsAiController.php app/Services/Rps/RpsAiContextService.php resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Separate CPMK review from Bloom mapping"
          git push origin HEAD:main
