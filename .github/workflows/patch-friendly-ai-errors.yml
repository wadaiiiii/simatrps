name: Patch Friendly AI Errors

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-friendly-ai-errors.py'
      - '.github/workflows/patch-friendly-ai-errors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-friendly-ai-errors.py

      - name: Verify patch
        run: |
          grep -q "function friendlyAiError" resources/js/pages/rps/show.tsx
          grep -q "AI belum berhasil memproses permintaan" resources/js/pages/rps/show.tsx
          grep -q "Fitur AI sedang tidak tersedia" resources/js/pages/rps/show.tsx
          git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          git commit -m "Hide technical AI provider errors from users"
          git push origin main
