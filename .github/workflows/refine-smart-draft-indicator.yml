name: Refine Smart Draft Indicator

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refine generated assessment indicators
        run: |
          python3 .github/scripts/refine_smart_draft_indicator.py
          php -l app/Services/Rps/RpsSmartDraftService.php

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Rps/RpsSmartDraftService.php
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refine automatic RPS assessment indicators"
          git push
