name: Patch Reference Inline Editor

on:
  push:
    paths:
      - '.github/scripts/patch-reference-inline-editor.py'
      - '.github/workflows/patch-reference-inline-editor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch-reference-inline-editor.py

      - name: Verify repair
        run: |
          php -l app/Http/Controllers/RpsDocumentController.php
          php -l routes/web.php
          grep -q "document-meta/references" routes/web.php
          grep -q "public function updateReferences" app/Http/Controllers/RpsDocumentController.php
          grep -q "syncEditorFromMeta" resources/js/pages/rps/show.tsx
          grep -q "Editor sudah disinkronkan dengan hasil terbaru" resources/js/pages/rps/show.tsx
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/web.php app/Http/Controllers/RpsDocumentController.php resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Pustaka editing after AI review"
            git push origin HEAD:main
          fi
