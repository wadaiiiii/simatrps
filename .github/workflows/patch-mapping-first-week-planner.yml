name: Patch Mapping-First Week Planner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply mapping-first planner patch
        run: |
          python3 .github/scripts/patch_mapping_first_week_planner.py
          php -l app/Services/Rps/RpsSmartDraftService.php
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Services/Rps/RpsAiContextService.php

      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/patch_mapping_first_week_planner.py
          rm -f .github/workflows/patch-mapping-first-week-planner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use mapping-first weekly planning for RPS automation"
          git push
