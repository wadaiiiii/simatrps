name: Add CPMK Curriculum Restore

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add CPMK curriculum restore
        run: |
          python3 .github/scripts/add_import_curriculum_cpmk.py
          php -l app/Http/Controllers/ObeWorkspaceController.php
          php -l routes/web.php

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/ObeWorkspaceController.php routes/web.php resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add CPMK restore from curriculum master"
          git push
