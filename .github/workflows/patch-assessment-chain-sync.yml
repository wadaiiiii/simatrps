name: Patch assessment chain sync

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-assessment-chain-sync.py'
      - '.github/workflows/patch-assessment-chain-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply assessment chain synchronization patch
        run: python .github/scripts/patch-assessment-chain-sync.py
      - name: Validate PHP syntax
        run: |
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Http/Controllers/RpsAssessmentController.php
          php -l app/Http/Controllers/RpsTaskController.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Services/Rps/RpsSmartDraftService.php
          php -l app/Http/Controllers/RpsDocumentController.php
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Services/Rps/ObeWorkspaceService.php
      - name: Validate UI markers
        run: |
          grep -q "Sinkronisasi Rantai Asesmen" app/Services/Rps/ObeWorkspaceService.php
          grep -q "Menunggu 100%" resources/js/pages/rps/show.tsx
          grep -q "assessment_names_by_week" app/Http/Controllers/RpsController.php
      - name: Commit implementation and cleanup
        run: |
          rm .github/scripts/patch-assessment-chain-sync.py
          rm .github/workflows/patch-assessment-chain-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize Sub-CPMK assessment chain end to end"
          git push
