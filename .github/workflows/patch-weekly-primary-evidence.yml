name: Patch weekly primary assessment evidence

on:
  push:
    paths:
      - '.github/workflows/patch-weekly-primary-evidence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-weekly-primary-evidence.py
      - name: Validate PHP syntax
        run: |
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Services/Rps/ObeWorkspaceService.php
      - name: Validate frontend markers
        run: |
          grep -q "Bukti Penilaian per Pekan" app/Services/Rps/ObeWorkspaceService.php
          grep -q "satu bukti utama per pekan" resources/js/pages/rps/show.tsx
          grep -q "ambiguous_evidence_weeks" app/Services/Rps/RpsAssessmentSyncService.php
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/patch-weekly-primary-evidence.py
          rm -f .github/workflows/patch-weekly-primary-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use one primary assessment evidence per week"
          git push
