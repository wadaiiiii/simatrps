name: Patch Bloom Guard V2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Bloom guard v2
        run: |
          python3 .github/scripts/patch_bloom_guard_v2.py
          php -l app/Http/Controllers/RpsAiController.php

      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/patch_bloom_guard_v2.py .github/workflows/patch-bloom-guard-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAiController.php .github/scripts/patch_bloom_guard_v2.py .github/workflows/patch-bloom-guard-v2.yml
          git commit -m "Guard Bloom levels across CPMK and Sub-CPMK AI"
          git push
