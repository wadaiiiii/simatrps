name: Patch RPS Sync and Print Spacing V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rps-sync-spacing-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python .github/scripts/patch-rps-sync-spacing-v2.py

      - name: Verify patch
        run: |
          python -m py_compile .github/scripts/patch-rps-sync-spacing-v2.py
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Http/Controllers/RpsAssessmentController.php
          grep -q "repairGeneratedArtifacts" app/Services/Rps/RpsAssessmentSyncService.php
          grep -q "ai_accepted.*ai_generated" app/Services/Rps/RpsAssessmentSyncService.php
          grep -q "rps-print-week-gap" resources/js/pages/rps/show.tsx
          grep -q "rps-print-institution-grid" resources/js/pages/rps/show.tsx
          grep -q "rps-print-rtm-sheet" resources/js/pages/rps/show.tsx
          test "$(grep -c 'JURUSAN MATEMATIKA' resources/js/pages/rps/show.tsx)" -ge 2
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Rps/RpsAssessmentSyncService.php app/Http/Controllers/RpsController.php app/Http/Controllers/RpsAssessmentController.php resources/js/pages/rps/show.tsx resources/css/app.css
          git commit -m "Repair assessment RTM sync and tighten RPS print spacing"
          git push
