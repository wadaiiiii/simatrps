name: Apply validator batch keep

on:
  push:
    paths:
      - '.github/workflows/apply-validator-batch-keep.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_validator_batch_keep.py

      - name: Validate backend
        run: php -l app/Http/Controllers/RpsValidatorDecisionController.php

      - name: Validate frontend markers
        run: |
          grep -q "Pertahankan Semua" resources/js/pages/rps/show.tsx
          grep -q "subject_keys: decisionKeys" resources/js/pages/rps/show.tsx
          grep -q "only: \['progress'\]" resources/js/pages/rps/show.tsx

      - name: Frontend build
        env:
          VERCEL: '1'
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx app/Http/Controllers/RpsValidatorDecisionController.php
          git rm .github/scripts/patch_validator_batch_keep.py
          git rm .github/workflows/apply-validator-batch-keep.yml
          git commit -m "Batch lecturer decisions in OBE validator"
          git push
