name: Shorten validator messages
on:
  push:
    paths:
      - '.github/scripts/shorten_validator_messages.py'
      - '.github/workflows/shorten-validator-messages.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/shorten_validator_messages.py
      - name: Validate PHP syntax
        run: php -l app/Services/Rps/ObeWorkspaceService.php
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/shorten_validator_messages.py .github/workflows/shorten-validator-messages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify OBE validator messages'
          git push origin main
