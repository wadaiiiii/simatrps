name: Fix RTM delete recreation
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_rtm_delete_recreation.py'
      - '.github/workflows/fix-rtm-delete-recreation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python .github/scripts/fix_rtm_delete_recreation.py
      - name: Validate PHP syntax
        run: |
          php -l app/Http/Controllers/RpsController.php
          php -l app/Http/Controllers/RpsTaskController.php
      - name: Validate markers
        run: |
          grep -q "Halaman RPS bersifat read-only terhadap RTM" app/Http/Controllers/RpsController.php
          grep -q "satu-satunya RTM untuk asesmen" app/Http/Controllers/RpsTaskController.php
      - name: Commit implementation and cleanup
        run: |
          rm .github/scripts/fix_rtm_delete_recreation.py
          rm .github/workflows/fix-rtm-delete-recreation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsController.php app/Http/Controllers/RpsTaskController.php .github/scripts/fix_rtm_delete_recreation.py .github/workflows/fix-rtm-delete-recreation.yml
          git commit -m "Keep deleted RTM from being recreated on page load"
          git push
