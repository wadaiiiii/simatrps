name: SiMatRPS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'work/**'
      - 'fix/**'
      - 'feat/**'

concurrency:
  group: simatrps-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 .github/scripts/apply-assessment-rtm-review-ux-v2.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/Feature/Admin/RpsReviewTest.php')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          php -l app/Http/Controllers/RpsTaskController.php
          php -l app/Http/Controllers/RpsController.php
          php -l database/migrations/2026_08_20_081500_repair_duplicate_assessment_rtm.php
          php -l tests/Feature/RpsTaskSyncTest.php
          git diff --check

      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-assessment-rtm-review-ux-v2.py
          git add app resources database tests .github/scripts
          git commit -m "Fix duplicate RTM sync and refine review UX"
          git push origin HEAD:fix/assessment-rtm-review-ux-v2
