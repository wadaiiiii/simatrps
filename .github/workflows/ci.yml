name: SiMatRPS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'work/**'
      - 'fix/**'
      - 'feat/**'

concurrency:
  group: simatrps-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Pint formatting
        run: vendor/bin/pint app/Http/Controllers/RpsTaskController.php app/Http/Controllers/RpsController.php database/migrations/2026_08_20_081500_repair_duplicate_assessment_rtm.php tests/Feature/RpsTaskSyncTest.php tests/Feature/Admin/RpsReviewTest.php

      - name: Commit formatted PHP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsTaskController.php app/Http/Controllers/RpsController.php database/migrations/2026_08_20_081500_repair_duplicate_assessment_rtm.php tests/Feature/RpsTaskSyncTest.php tests/Feature/Admin/RpsReviewTest.php
          git diff --cached --quiet && exit 0
          git commit -m "Format RTM sync changes"
          git push origin HEAD:fix/assessment-rtm-review-ux-v2
