name: Apply RTM due week patch

on:
  push:
    branches:
      - fix/rtm-due-week-material-coverage-override

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rtm-due-week-material-coverage-override
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_rtm_due_material_override.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/Services/Rps/RpsAssessmentSyncService.php app/Services/Rps/ObeWorkspaceService.php app/Http/Controllers/RpsValidatorDecisionController.php resources/js/pages/rps/show.tsx tests/Feature/RpsTaskSyncTest.php
          git diff --cached --quiet && exit 0
          git commit -m "Sync RTM due week and allow material coverage override"
          git push origin HEAD:fix/rtm-due-week-material-coverage-override
