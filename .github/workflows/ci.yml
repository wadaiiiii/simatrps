name: SiMatRPS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'work/**'
      - 'fix/**'
      - 'feat/**'

concurrency:
  group: simatrps-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-off RTM UX patch
        run: |
          python3 .github/scripts/patch-assessment-rtm-review-ux.py
          php -l app/Http/Controllers/RpsTaskController.php
          php -l app/Http/Controllers/RpsController.php
          php -l database/migrations/2026_08_20_080000_repair_manual_rtm_assessment_duplicates.php
          php -l tests/Feature/RpsTaskSyncTest.php
          git diff --check

      - name: Commit functional patch and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch-assessment-rtm-review-ux.py
          git rm .github/workflows/patch-assessment-rtm-review-ux.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add -A
          git commit -m "Fix RTM sync and refine review UX"
          git push origin HEAD:fix/assessment-rtm-review-ux

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          find app routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
