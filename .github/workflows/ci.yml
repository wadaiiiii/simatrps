name: SiMatRPS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'work/**'
      - 'fix/**'
      - 'feat/**'

concurrency:
  group: simatrps-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and commit weekly technique patch
        if: github.ref_name == 'fix/weekly-assessment-technique' || github.head_ref == 'fix/weekly-assessment-technique'
        shell: bash
        run: |
          set +e
          python3 .github/scripts/patch-weekly-assessment-technique.py >/tmp/weekly-technique-patch.log 2>&1
          patch_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$patch_status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/weekly-technique-patch.log .github/weekly-technique-patch-error.log
            git add .github/weekly-technique-patch-error.log
            git commit -m "Log weekly technique patch failure"
            git push origin HEAD:fix/weekly-assessment-technique
            cat /tmp/weekly-technique-patch.log
            exit "$patch_status"
          fi

          php -l app/Http/Controllers/RpsController.php
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Http/Controllers/Admin/RpsReviewController.php
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l tests/Feature/RpsTaskSyncTest.php
          git diff --check

          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/scripts/patch-weekly-assessment-technique.py
          git add -- resources/js/pages/rps/show.tsx resources/js/pages/admin/rps-review.tsx app/Http/Controllers/RpsController.php app/Http/Controllers/RpsAiController.php app/Http/Controllers/Admin/RpsReviewController.php app/Services/Rps/RpsAssessmentSyncService.php tests/Feature/RpsTaskSyncTest.php .github/workflows/ci.yml
          git commit -m "Align weekly RPS criteria and technique"
          git push origin HEAD:fix/weekly-assessment-technique
          exit 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          find app routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
