name: Patch Smart Draft Compact Print Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-smart-draft-compact-print-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair patch script typo
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch-smart-draft-compact-print-flow.py')
          text = path.read_text(encoding='utf-8')
          old = "$level = strtoupper(trim((string) ($sub->bloom_level ?? ''));"
          new = "$level = strtoupper(trim((string) ($sub->bloom_level ?? '')));"
          if old not in text:
              raise SystemExit('Expected helper typo was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply patch
        run: python .github/scripts/patch-smart-draft-compact-print-flow.py

      - name: Verify patch
        run: |
          python -m py_compile .github/scripts/patch-smart-draft-compact-print-flow.py
          php -l app/Services/Rps/RpsSmartDraftService.php
          grep -q "learningActivityForWeek" app/Services/Rps/RpsSmartDraftService.php
          grep -q "Maksimal dua topik inti per pekan" app/Services/Rps/RpsSmartDraftService.php
          grep -q "compact Smart Draft + continuous weekly print flow" resources/css/app.css
          grep -q "height: 10px" resources/css/app.css
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/patch-smart-draft-compact-print-flow.py app/Services/Rps/RpsSmartDraftService.php resources/css/app.css
          git commit -m "Keep weekly smart draft concise and print table continuous"
          git push
