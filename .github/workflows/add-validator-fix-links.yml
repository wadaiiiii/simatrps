name: Add validator fix links

on:
  push:
    paths:
      - '.github/workflows/add-validator-fix-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/add_validator_fix_links.py
      - name: Validate frontend markers
        run: |
          grep -q 'const VALIDATOR_FIX_META:' resources/js/pages/rps/show.tsx
          grep -q 'validator-target-rtm' resources/js/pages/rps/show.tsx
          grep -q 'validatorFixLabel(check)' resources/js/pages/rps/show.tsx
          grep -q 'data-rtm-week' resources/js/pages/rps/show.tsx
      - name: Commit implementation and cleanup
        run: |
          rm .github/scripts/add_validator_fix_links.py
          rm .github/workflows/add-validator-fix-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Guide OBE validator fixes to the correct editor'
          git push
