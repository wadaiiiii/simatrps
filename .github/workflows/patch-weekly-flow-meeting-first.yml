name: Patch Meeting First Weekly Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-weekly-flow-meeting-first.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python .github/scripts/patch-weekly-flow-meeting-first.py

      - name: Verify patch
        run: |
          python -m py_compile .github/scripts/patch-weekly-flow-meeting-first.py
          grep -q "1. Atur Pertemuan" resources/js/pages/rps/show.tsx
          grep -q "2. Isi Bagian Kosong" resources/js/pages/rps/show.tsx
          grep -q "Banyak Pertemuan" resources/js/pages/rps/show.tsx
          grep -q "Mulai dengan Atur Pertemuan" resources/js/pages/rps/show.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          git commit -m "Guide lecturers to allocate meetings before weekly RPS"
          git push
