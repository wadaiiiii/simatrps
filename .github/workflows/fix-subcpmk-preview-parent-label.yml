name: Fix Sub-CPMK Preview Parent Label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hide CPMK parent badge only in print preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('resources/js/pages/rps/show.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700"'
          new = 'className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700 print:hidden"'
          if old not in s:
              raise SystemExit('Target parent CPMK badge class not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -n 'text-teal-700 print:hidden' resources/js/pages/rps/show.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Hide CPMK parent badge in RPS preview"
          git push
