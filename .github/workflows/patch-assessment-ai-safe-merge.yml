name: Patch Assessment AI Safe Merge

# Staged source-of-truth patch runner.
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-assessment-ai-safe-merge.py'
      - '.github/scripts/patch-assessment-source-tail.py'
      - '.github/workflows/patch-assessment-ai-safe-merge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply service and validator patch
        run: |
          set +e
          python3 .github/scripts/patch-assessment-ai-safe-merge.py
          echo "Primary patch may stop at the legacy weekly-AI marker; continuing with the source-tail patch."
          exit 0

      - name: Apply AI, manual guardrail and UI patch
        run: python3 .github/scripts/patch-assessment-source-tail.py

      - name: Verify patch
        run: |
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Http/Controllers/RpsAssessmentController.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Http/Controllers/RpsAutomationController.php
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Services/Rps/ObeWorkspaceService.php
          grep -q "rtm-integrative-v5-assessment-source" app/Http/Controllers/RpsAiController.php
          grep -q "assertNonExamAssessmentCoverage" app/Http/Controllers/RpsAiController.php
          grep -q "uncovered_non_exam_sub_codes" app/Services/Rps/RpsAssessmentSyncService.php
          grep -q "problem_tasks" app/Services/Rps/ObeWorkspaceService.php
          grep -q "Detail Asesmen adalah sumber utama" resources/js/pages/rps/show.tsx
          grep -q "assessmentGuidance" app/Http/Controllers/RpsAssessmentController.php
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/Http/Controllers/RpsAiController.php \
            app/Http/Controllers/RpsAssessmentController.php \
            app/Http/Controllers/RpsController.php \
            app/Http/Controllers/RpsAutomationController.php \
            app/Services/Rps/RpsAssessmentSyncService.php \
            app/Services/Rps/ObeWorkspaceService.php \
            resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Make Detail Asesmen the assessment source of truth"
          git push origin main
