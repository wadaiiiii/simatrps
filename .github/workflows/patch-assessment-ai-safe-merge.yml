name: Patch Assessment AI Safe Merge

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-assessment-ai-safe-merge.py'
      - '.github/workflows/patch-assessment-ai-safe-merge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize current-source marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch-assessment-ai-safe-merge.py')
          s = p.read_text()
          s = s.replace(
              "        // Store as accepted audit history\\n",
              "        // Store as accepted audit history, but do not keep it in the active\\n        // recommendation panel because the lecturer explicitly requested it\\n        // from the week row.\\n",
          )
          p.write_text(s)
          PY

      - name: Apply patch with diagnostics
        run: |
          set +e
          python3 .github/scripts/patch-assessment-ai-safe-merge.py > /tmp/patch.log 2>&1
          status=$?
          cat /tmp/patch.log
          if [ $status -ne 0 ]; then
            cp /tmp/patch.log .github/assessment-source-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/assessment-source-patch-error.txt
            git commit -m "Record assessment source patch diagnostic"
            git push origin main
            exit $status
          fi

      - name: Verify patch
        run: |
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Http/Controllers/RpsAssessmentController.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Http/Controllers/RpsAutomationController.php
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Services/Rps/ObeWorkspaceService.php
          grep -q "rtm-integrative-v5-assessment-source" app/Http/Controllers/RpsAiController.php
          grep -q "assertNonExamAssessmentCoverage" app/Http/Controllers/RpsAiController.php
          grep -q "uncovered_non_exam_sub_codes" app/Services/Rps/RpsAssessmentSyncService.php
          grep -q "problem_tasks" app/Services/Rps/ObeWorkspaceService.php
          grep -q "Detail Asesmen adalah sumber utama" resources/js/pages/rps/show.tsx
          git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet -- app/Http/Controllers/RpsAiController.php app/Http/Controllers/RpsAssessmentController.php app/Http/Controllers/RpsController.php app/Http/Controllers/RpsAutomationController.php app/Services/Rps/RpsAssessmentSyncService.php app/Services/Rps/ObeWorkspaceService.php resources/js/pages/rps/show.tsx; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/Http/Controllers/RpsAiController.php \
            app/Http/Controllers/RpsAssessmentController.php \
            app/Http/Controllers/RpsController.php \
            app/Http/Controllers/RpsAutomationController.php \
            app/Services/Rps/RpsAssessmentSyncService.php \
            app/Services/Rps/ObeWorkspaceService.php \
            resources/js/pages/rps/show.tsx
          git commit -m "Make Detail Asesmen the assessment source of truth"
          git push origin main
