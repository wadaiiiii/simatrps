name: Fix CPMK AI buttons

on:
  push:
    paths:
      - '.github/scripts/fix_cpmk_ai_buttons.py'
      - '.github/workflows/fix-cpmk-ai-buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/fix_cpmk_ai_buttons.py

      - name: Verify changed guards
        run: |
          grep -A4 'label="Telaah CPMK AI"' resources/js/pages/rps/show.tsx
          grep -A4 'label="Pemetaan Bloom AI"' resources/js/pages/rps/show.tsx
          grep -A4 'label="Pemetaan CPMK → CPL AI"' resources/js/pages/rps/show.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend in Vercel mode
        env:
          VERCEL: '1'
        run: npm run build

      - name: Commit implementation and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          git rm .github/scripts/fix_cpmk_ai_buttons.py .github/workflows/fix-cpmk-ai-buttons.yml
          git commit -m "Keep CPMK AI actions available when CPMK data exists"
          git push
