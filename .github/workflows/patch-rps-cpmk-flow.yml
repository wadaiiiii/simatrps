name: Patch RPS CPMK flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rps-cpmk-flow.yml'

permissions:
  contents: write

jobs:
  patch-rps-cpmk-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move CPMK-CPL AI action to CPMK header
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('resources/js/pages/rps/show.tsx')
          text = path.read_text(encoding='utf-8')

          mapping_pattern = re.compile(
              r'\n[ \t]*<SectionAiButton\s*\n'
              r'[ \t]*label="AI Pemetaan"\s*\n'
              r'[\s\S]*?suggestions=\{cplMappingSuggestions\}[\s\S]*?\n[ \t]*/>',
          )
          text, removed = mapping_pattern.subn('', text, count=1)
          if removed != 1:
              raise SystemExit(f'Expected one AI Pemetaan button, removed {removed}')

          text, renamed = re.subn(
              r'label="Telaah CPMK AI"',
              'label="Telaah CPMK + Bloom AI"',
              text,
              count=1,
          )
          if renamed != 1:
              raise SystemExit(f'Expected one Telaah CPMK AI label, renamed {renamed}')

          review_pattern = re.compile(
              r'(?P<indent>[ \t]*)<SectionAiButton\s*\n'
              r'(?P=indent)[ \t]+label="Telaah CPMK \+ Bloom AI"\s*\n'
              r'(?P<body>[\s\S]*?suggestions=\{cpmkReviewSuggestions\}[\s\S]*?\n(?P=indent)/>)'
          )
          match = review_pattern.search(text)
          if not match:
              raise SystemExit('Could not find the CPMK review button after renaming')

          indent = match.group('indent')
          mapping_block = (
              '\n'
              f'{indent}<SectionAiButton\n'
              f'{indent}    label="Pemetaan CPMK → CPL AI"\n'
              f'{indent}    busy={{aiBusyType === \'cpl_mapping\'}}\n'
              f'{indent}    disabled={{!ai.configured || cpmks.length === 0}}\n'
              f'{indent}    onClick={{() => generateAi(\'cpl_mapping\')}}\n'
              f'{indent}    suggestions={{cplMappingSuggestions}}\n'
              f'{indent}    rpsId={{rps.id}}\n'
              f'{indent}/>'
          )

          insert_at = match.end()
          text = text[:insert_at] + mapping_block + text[insert_at:]
          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          if git diff --quiet -- resources/js/pages/rps/show.tsx; then
            echo "No change required"
            exit 0
          fi
          git config user.name "SiMatRPS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          git commit -m "Refine CPMK AI action flow"
          git push origin HEAD:main
