name: Patch RPS CPMK flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rps-cpmk-flow.yml'

permissions:
  contents: write

jobs:
  patch-rps-cpmk-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move CPMK-CPL AI action to CPMK header
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/js/pages/rps/show.tsx')
          text = path.read_text(encoding='utf-8')

          old_cpl = '''                                        <div className="flex items-center justify-between gap-2">
                                            <span>CPL-PRODI yang dibebankan pada MK</span>
                                            <SectionAiButton
                                                label="AI Pemetaan"
                                                busy={aiBusyType === 'cpl_mapping'}
                                                disabled={!ai.configured || cpmks.length === 0}
                                                onClick={() => generateAi('cpl_mapping')}
                                                suggestions={cplMappingSuggestions}
                                                rpsId={rps.id}
                                            />
                                        </div>'''
          new_cpl = '''                                        <span>CPL-PRODI yang dibebankan pada MK</span>'''

          if text.count(old_cpl) != 1:
              raise SystemExit(f'Expected exactly one CPL AI block, found {text.count(old_cpl)}')
          text = text.replace(old_cpl, new_cpl, 1)

          old_cpmk = '''                                                <SectionAiButton
                                                    label="Telaah CPMK AI"
                                                    busy={aiBusyType === 'cpmk_review'}
                                                    disabled={!ai.configured || cpmks.length === 0}
                                                    onClick={() => generateAi('cpmk_review')}
                                                    suggestions={cpmkReviewSuggestions}
                                                    rpsId={rps.id}
                                                />'''
          new_cpmk = '''                                                <SectionAiButton
                                                    label="Telaah CPMK + Bloom AI"
                                                    busy={aiBusyType === 'cpmk_review'}
                                                    disabled={!ai.configured || cpmks.length === 0}
                                                    onClick={() => generateAi('cpmk_review')}
                                                    suggestions={cpmkReviewSuggestions}
                                                    rpsId={rps.id}
                                                />
                                                <SectionAiButton
                                                    label="Pemetaan CPMK → CPL AI"
                                                    busy={aiBusyType === 'cpl_mapping'}
                                                    disabled={!ai.configured || cpmks.length === 0}
                                                    onClick={() => generateAi('cpl_mapping')}
                                                    suggestions={cplMappingSuggestions}
                                                    rpsId={rps.id}
                                                />'''

          if text.count(old_cpmk) != 1:
              raise SystemExit(f'Expected exactly one CPMK AI block, found {text.count(old_cpmk)}')
          text = text.replace(old_cpmk, new_cpmk, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          if git diff --quiet -- resources/js/pages/rps/show.tsx; then
            echo "No change required"
            exit 0
          fi
          git config user.name "SiMatRPS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          git commit -m "Refine CPMK AI action flow"
          git push origin HEAD:main
