name: Patch RTM Delete Guidance and Validator Label

on:
  push:
    paths:
      - '.github/workflows/patch-rtm-delete-guidance-validator-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply RTM delete guidance patch
        run: python .github/scripts/patch-rtm-delete-guidance-validator-label.py

      - name: PHP syntax check
        run: |
          php -l app/Http/Controllers/RpsTaskController.php
          php -l app/Services/Rps/ObeWorkspaceService.php

      - name: Verify markers
        run: |
          grep -F "function goToAssessmentItem" resources/js/pages/rps/show.tsx
          grep -F "Pertahankan Isi" resources/js/pages/rps/show.tsx
          grep -F "Pertahankan Semua Isi" resources/js/pages/rps/show.tsx
          grep -F "item tersebut disorot untuk diperiksa" resources/js/pages/rps/show.tsx
          grep -F "buka Detail Asesmen" app/Http/Controllers/RpsTaskController.php
          grep -F "pertahankan isi jika memang disengaja" app/Services/Rps/ObeWorkspaceService.php
          git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx app/Http/Controllers/RpsTaskController.php app/Services/Rps/ObeWorkspaceService.php
          git commit -m "Guide blocked RTM deletion to its assessment"
          git push origin HEAD:main
