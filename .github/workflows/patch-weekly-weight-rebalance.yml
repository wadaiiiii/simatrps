name: Patch weekly weight rebalance

on:
  push:
    paths:
      - '.github/workflows/patch-weekly-weight-rebalance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply weekly weight rebalance patch
        run: python .github/scripts/patch-weekly-weight-rebalance.py
      - name: Validate PHP syntax
        run: |
          php -l app/Services/Rps/RpsSmartDraftService.php
          php -l app/Http/Controllers/RpsDocumentController.php
          php -l app/Http/Controllers/RpsAiController.php
          php -l database/migrations/2026_08_16_192500_add_assessment_weight_source_to_rps_weekly_plans.php
      - name: Validate implementation markers
        run: |
          grep -q "fallback rata per Sub-CPMK" app/Services/Rps/RpsSmartDraftService.php
          grep -q "assessment_weight_source.*manual" app/Http/Controllers/RpsDocumentController.php
          grep -q "Jangan pernah menulis" app/Http/Controllers/RpsAiController.php
      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebalance weekly Sub-CPMK weights from partial assessments"
          git push
