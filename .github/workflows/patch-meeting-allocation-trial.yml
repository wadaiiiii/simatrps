name: Patch meeting allocation trial

on:
  push:
    paths:
      - '.simatrps_patch_meeting_allocation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply meeting allocation trial
        run: python .simatrps_patch_meeting_allocation.py
      - name: Validate
        run: |
          php -l app/Http/Controllers/RpsAutomationController.php
          php -l app/Http/Controllers/ObeWorkspaceController.php
          php -l app/Services/Rps/RpsSmartDraftService.php
          php -l app/Http/Controllers/RpsAiController.php
      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .simatrps_patch_meeting_allocation.py .github/workflows/patch-meeting-allocation-trial.yml
          git add -A
          git commit -m "Add lecturer-controlled Sub-CPMK meeting allocation" || exit 0
          git push
