name: Correct Sub-CPMK Preview Parent Label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Correct preview-only label visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('resources/js/pages/rps/show.tsx')
          s = p.read_text(encoding='utf-8')

          wrong = '<span key={code} className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700 print:hidden">'
          right = '<span key={code} className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700">'
          if wrong not in s:
              raise SystemExit('CPL badge correction target not found')
          s = s.replace(wrong, right, 1)

          parent_old = '''{parentCode && (\n                        <span className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700">\n                            {parentCode}\n                        </span>\n                    )}'''
          parent_new = '''{parentCode && (\n                        <span className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700 print:hidden">\n                            {parentCode}\n                        </span>\n                    )}'''
          if parent_old not in s:
              raise SystemExit('Sub-CPMK parent badge target not found')
          s = s.replace(parent_old, parent_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify focused change
        run: |
          grep -n -A5 -B2 'parentCode &&' resources/js/pages/rps/show.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Hide only Sub-CPMK parent badge in preview"
          git push
