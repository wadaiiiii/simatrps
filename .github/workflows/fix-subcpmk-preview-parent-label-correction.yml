name: Correct Sub-CPMK Preview Parent Label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore CPL badges and keep parent badge hidden in preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('resources/js/pages/rps/show.tsx')
          s = p.read_text(encoding='utf-8')

          wrong = '<span key={code} className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700 print:hidden">'
          right = '<span key={code} className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700">'
          if wrong in s:
              s = s.replace(wrong, right, 1)

          parent_expected = '<span className="rounded-full bg-teal-50 px-1.5 py-[1px] text-[8px] font-bold text-teal-700 print:hidden">\n                            {parentCode}'
          if parent_expected not in s:
              raise SystemExit('Sub-CPMK parent badge is not hidden for preview')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore CPL badges while hiding Sub-CPMK parent in preview"
          git push
