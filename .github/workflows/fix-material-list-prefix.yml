name: Fix material list prefix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-material-list-prefix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch curriculum material prefix handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Backend: strip curriculum enumeration markers before storing topics.
          p = Path('app/Services/Rps/RpsSyllabusService.php')
          s = p.read_text(encoding='utf-8')
          old = '''        return array_values(array_filter(array_map(function (string $topic): string {
            $topic = trim($topic, " \\t\\n\\r\\0\\x0B,.;");
            return $topic;
        }, $topics), fn (string $topic) => mb_strlen($topic) >= 3));'''
          new = '''        return array_values(array_filter(array_map(function (string $topic): string {
            $topic = trim($topic, " \\t\\n\\r\\0\\x0B,.;");

            // Master silabus kadang sudah memakai enumerasi a., b., c. atau
            // 1., 2., dst. Nomor/huruf daftar adalah presentasi, bukan bagian
            // dari judul Bahan Kajian. Hilangkan agar UI tidak menjadi a. a.
            $topic = preg_replace(
                '/^\\s*(?:(?:[a-z]|\\d{1,2})[\\.\\)]\\s*)+/iu',
                '',
                $topic
            ) ?? $topic;

            return trim($topic);
        }, $topics), fn (string $topic) => mb_strlen($topic) >= 3));'''
          if old not in s:
              raise SystemExit('RpsSyllabusService target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Frontend: normalize legacy imported rows already in the database.
          p = Path('resources/js/pages/rps/show.tsx')
          s = p.read_text(encoding='utf-8')
          anchor = '''function safeList(value: any): any[] {
    return Array.isArray(value) ? value : [];
}
'''
          helper = '''function safeList(value: any): any[] {
    return Array.isArray(value) ? value : [];
}

function stripMaterialListPrefix(value: any) {
    return String(value ?? '')
        .replace(/^\\s*(?:(?:[a-z]|\\d{1,2})[.)]\\s*)+/iu, '')
        .trim();
}
'''
          if anchor not in s:
              raise SystemExit('safeList anchor not found')
          s = s.replace(anchor, helper, 1)

          old_li = '<li key={item.id}>{item.title}</li>'
          new_li = '<li key={item.id}>{stripMaterialListPrefix(item.title)}</li>'
          if old_li not in s:
              raise SystemExit('material list item target not found')
          s = s.replace(old_li, new_li, 1)

          old_form = """function MaterialEditRow({ rpsId, material }: any) {
    const form = useForm({
        title: material.title ?? '',
    });"""
          new_form = """function MaterialEditRow({ rpsId, material }: any) {
    const form = useForm({
        title: stripMaterialListPrefix(material.title),
    });"""
          if old_form not in s:
              raise SystemExit('MaterialEditRow target not found')
          s = s.replace(old_form, new_form, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          php -l app/Services/Rps/RpsSyllabusService.php
          grep -q "stripMaterialListPrefix" resources/js/pages/rps/show.tsx
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/workflows/fix-material-list-prefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Rps/RpsSyllabusService.php resources/js/pages/rps/show.tsx .github/workflows/fix-material-list-prefix.yml
          git commit -m "Normalize curriculum material list prefixes"
          git push
