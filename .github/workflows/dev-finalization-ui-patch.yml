name: Dev Finalization UI Patch

on:
  push:
    branches:
      - feat/rps-finalization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rps-finalization
          fetch-depth: 0

      - name: Patch finalization UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('resources/js/pages/rps/show.tsx')
          text = path.read_text()

          anchor = """    const totalWeeklyWeight = weeks.reduce(\n        (sum: number, week: any) => sum + Number(week.assessment_weight || 0),\n        0,\n    );\n\n    return (\n"""
          replacement = """    const totalWeeklyWeight = weeks.reduce(\n        (sum: number, week: any) => sum + Number(week.assessment_weight || 0),\n        0,\n    );\n    const obeIsValid = progress?.is_valid === true;\n    const rpsStatus = String(rps?.status ?? 'draft').toLowerCase();\n    const rpsIsFinal = rpsStatus === 'final' && obeIsValid;\n    const finalizationReady = obeIsValid && !rpsIsFinal;\n\n    const validateObe = () => router.post(\n        `/rps/${rps.id}/validate-obe`,\n        {},\n        actionOptions('Validasi OBE selesai.'),\n    );\n\n    const finalizeRps = () => {\n        if (!confirm('Finalisasi RPS? Setelah difinalisasi, status dokumen menjadi Final. Jika ingin mengubah isi kembali, gunakan Buka Kembali.')) {\n            return;\n        }\n\n        router.post(\n            `/rps/${rps.id}/finalize`,\n            {},\n            actionOptions('RPS berhasil difinalisasi dan siap digunakan.'),\n        );\n    };\n\n    const reopenRps = () => {\n        if (!confirm('Buka kembali RPS untuk diedit? Status Final akan dikembalikan menjadi Draft dan perlu difinalisasi ulang setelah perubahan selesai.')) {\n            return;\n        }\n\n        router.post(\n            `/rps/${rps.id}/reopen`,\n            {},\n            actionOptions('RPS dibuka kembali untuk diedit.'),\n        );\n    };\n\n    return (\n"""

          if 'const obeIsValid = progress?.is_valid === true;' not in text:
              if anchor not in text:
                  raise SystemExit('totalWeeklyWeight anchor not found')
              text = text.replace(anchor, replacement, 1)

          old = """                        <div className=\"rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-bold text-slate-600\">\n                            OBE {progress.percent}%\n                        </div>\n\n                        <button\n                            type=\"button\"\n                            onClick={() => router.post(\n                                `/rps/${rps.id}/validate-obe`,\n                                {},\n                                actionOptions('Validasi OBE selesai.'),\n                            )}\n                            className=\"rounded-xl bg-teal-700 px-3 py-2 text-xs font-bold text-white\"\n                        >\n                            Validasi OBE\n                        </button>\n"""
          new = """                        <div className={`rounded-full border px-3 py-1.5 text-xs font-bold ${\n                            obeIsValid\n                                ? 'border-emerald-200 bg-emerald-50 text-emerald-700'\n                                : 'border-slate-200 bg-white text-slate-600'\n                        }`}>\n                            {obeIsValid ? 'OBE Valid ✓' : `OBE ${progress.percent}%`}\n                        </div>\n\n                        <div className={`rounded-full border px-3 py-1.5 text-xs font-bold ${\n                            rpsIsFinal\n                                ? 'border-emerald-200 bg-emerald-100 text-emerald-800'\n                                : finalizationReady\n                                    ? 'border-cyan-200 bg-cyan-50 text-cyan-800'\n                                    : 'border-slate-200 bg-slate-50 text-slate-500'\n                        }`}>\n                            {rpsIsFinal ? 'RPS Final ✓' : finalizationReady ? 'Siap Finalisasi' : 'Draft'}\n                        </div>\n\n                        {rpsIsFinal ? (\n                            <button\n                                type=\"button\"\n                                onClick={reopenRps}\n                                className=\"inline-flex items-center gap-1.5 rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50\"\n                            >\n                                <FilePenLine className=\"size-3.5\" />\n                                Buka Kembali\n                            </button>\n                        ) : finalizationReady ? (\n                            <button\n                                type=\"button\"\n                                onClick={finalizeRps}\n                                className=\"inline-flex items-center gap-1.5 rounded-xl bg-teal-700 px-3 py-2 text-xs font-bold text-white shadow-sm hover:bg-teal-800\"\n                            >\n                                <CheckCircle2 className=\"size-3.5\" />\n                                Finalisasi RPS\n                            </button>\n                        ) : (\n                            <button\n                                type=\"button\"\n                                onClick={validateObe}\n                                className=\"rounded-xl bg-teal-700 px-3 py-2 text-xs font-bold text-white hover:bg-teal-800\"\n                            >\n                                Validasi OBE\n                            </button>\n                        )}\n"""

          if 'Siap Finalisasi' not in text:
              if old not in text:
                  raise SystemExit('OBE toolbar anchor not found')
              text = text.replace(old, new, 1)

          path.write_text(text)

          routes = Path('routes/web.php')
          route_text = routes.read_text()
          route_text = route_text.replace(
              "Route::inertia('admin/templates')->name('templates');",
              "Route::inertia('template-rps', 'admin/templates')->name('templates');",
          )
          routes.write_text(route_text)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/js/pages/rps/show.tsx routes/web.php
          if git diff --cached --quiet; then
            echo "No UI patch needed"
            exit 0
          fi
          git commit -m "Add RPS finalization UX"
          git push origin HEAD:feat/rps-finalization
