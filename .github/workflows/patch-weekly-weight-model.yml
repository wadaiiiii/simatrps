name: Patch weekly Sub-CPMK assessment weight model
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-weekly-weight-model.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply weekly weight model patch
        run: python3 .github/scripts/patch_weekly_weight_model.py
      - name: Validate PHP syntax
        run: |
          php -l app/Http/Controllers/RpsDocumentController.php
          php -l app/Http/Controllers/RpsAssessmentController.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Http/Controllers/RpsAutomationController.php
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Services/Rps/RpsSmartDraftService.php
          php -l app/Services/Rps/ObeWorkspaceService.php
      - name: Validate implementation markers
        run: |
          grep -q "Pengukuran Sub-CPMK per Pekan" app/Services/Rps/ObeWorkspaceService.php
          grep -q "fillEmptyTeachingWeights" app/Services/Rps/RpsSmartDraftService.php
          grep -q "Bobot pengukuran minggu" app/Http/Controllers/RpsDocumentController.php
          grep -q "Edit Pekan" resources/js/pages/rps/show.tsx
          grep -q "Setiap pekan pembelajaran yang memuat Sub-CPMK harus memiliki bobot" resources/js/pages/rps/show.tsx
          grep -q "Bobot pekan:" resources/js/pages/rps/show.tsx
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/patch_weekly_weight_model.py
          rm -f .github/workflows/patch-weekly-weight-model.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsDocumentController.php \
                  app/Http/Controllers/RpsAssessmentController.php \
                  app/Http/Controllers/RpsController.php \
                  app/Http/Controllers/RpsAutomationController.php \
                  app/Http/Controllers/RpsAiController.php \
                  app/Services/Rps/RpsSmartDraftService.php \
                  app/Services/Rps/ObeWorkspaceService.php \
                  resources/js/pages/rps/show.tsx \
                  .github/scripts/patch_weekly_weight_model.py \
                  .github/workflows/patch-weekly-weight-model.yml
          git commit -m "Use weekly Sub-CPMK measurement weights"
          git push
