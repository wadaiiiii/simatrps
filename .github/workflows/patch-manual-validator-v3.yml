name: Patch Manual AI Protection and Validator Clarity V3

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-manual-validator-v3.py'
      - '.github/workflows/patch-manual-validator-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply small-source patch
        run: python3 .github/scripts/patch-manual-validator-v3.py

      - name: Verify source
        run: |
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Services/Rps/ObeWorkspaceService.php
          grep -q "Asesmen manual/dosen tidak boleh ditimpa oleh AI" app/Http/Controllers/RpsAiController.php
          grep -q "RTM manual/dosen tidak boleh ditimpa oleh AI" app/Http/Controllers/RpsAiController.php
          grep -q "Mencocokkan asesmen ↔ Sub-CPMK ↔ bobot pekan ↔ RTM" app/Services/Rps/ObeWorkspaceService.php
          grep -q "RTM harus sesuai dengan asesmen induk, Sub-CPMK, dan pekan pengumpulan" app/Services/Rps/ObeWorkspaceService.php
          grep -q "check.hint" resources/js/pages/rps/show.tsx
          git diff --check

      - name: Commit functional patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAiController.php app/Services/Rps/ObeWorkspaceService.php resources/js/pages/rps/show.tsx
          git commit -m "Clarify exact OBE assessment and RTM issues"
          git push origin main

      - name: Verify frontend build
        run: |
          npm ci
          npm run build

# exact-reason-trigger
