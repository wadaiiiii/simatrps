name: Apply semantic dash regex

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_semantic_dash_regex.py'
      - '.github/workflows/apply-semantic-dash-regex.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_semantic_dash_regex.py
      - run: php -l app/Services/Rps/ObeWorkspaceService.php
      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/patch_semantic_dash_regex.py .github/workflows/apply-semantic-dash-regex.yml
          git add -A
          git commit -m "Handle Unicode dashes in Sub-CPMK semantic checks"
          git push
