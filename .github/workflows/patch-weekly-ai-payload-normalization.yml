name: Patch Weekly AI Payload Normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-weekly-ai-payload-normalization.py'
      - '.github/workflows/patch-weekly-ai-payload-normalization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-weekly-ai-payload-normalization.py

      - name: Verify patch
        run: |
          php -l app/Http/Controllers/RpsAiController.php
          grep -q "normalizeWeeklyAiItem" app/Http/Controllers/RpsAiController.php
          grep -q "normalizeWeeklyAiText" app/Http/Controllers/RpsAiController.php
          grep -q "Kode diagnostik" app/Http/Controllers/RpsAiController.php
          git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAiController.php
          git commit -m "Normalize weekly AI payloads before processing"
          git push origin main
