name: Format PR19 PHP patch

on:
  push:
    branches:
      - fix/assessment-rtm-review-ux-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assessment-rtm-review-ux-v2
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --prefer-dist
      - name: Run Pint
        run: vendor/bin/pint app/Http/Controllers/RpsTaskController.php app/Http/Controllers/RpsController.php database/migrations/2026_08_20_081500_repair_duplicate_assessment_rtm.php tests/Feature/RpsTaskSyncTest.php tests/Feature/Admin/RpsReviewTest.php
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsTaskController.php app/Http/Controllers/RpsController.php database/migrations/2026_08_20_081500_repair_duplicate_assessment_rtm.php tests/Feature/RpsTaskSyncTest.php tests/Feature/Admin/RpsReviewTest.php
          git diff --cached --quiet && exit 0
          git commit -m "Fix PHP formatting for RTM sync patch"
          git push origin HEAD:fix/assessment-rtm-review-ux-v2
