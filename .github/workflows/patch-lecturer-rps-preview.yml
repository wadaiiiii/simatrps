name: Patch Lecturer RPS Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-lecturer-rps-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python .github/scripts/patch-lecturer-rps-preview.py

      - name: Verify focused changes
        run: |
          grep -q "Preview RPS" resources/js/components/app-sidebar.tsx
          grep -q "Route::get('preview'" routes/web.php
          grep -q "Lihat Preview" resources/js/pages/rps/index.tsx
          grep -q "Mode lihat saja" resources/js/pages/rps/show.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/app-sidebar.tsx routes/web.php resources/js/pages/rps/index.tsx resources/js/pages/rps/show.tsx
          git commit -m "Add lecturer RPS preview menu and read-only mode"
          git push
