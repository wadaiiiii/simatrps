name: Patch Weekly Activity Consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-weekly-activity-consistency.py'
      - '.github/workflows/patch-weekly-activity-consistency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-weekly-activity-consistency.py

      - name: Verify patch
        run: |
          php -l app/Http/Controllers/RpsAiController.php
          grep -q "scannableLearningActivity" resources/js/pages/rps/show.tsx
          grep -q "Daring / LMS" resources/js/pages/rps/show.tsx
          grep -q "str_word_count.*> 10" app/Http/Controllers/RpsAiController.php
          git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAiController.php resources/js/pages/rps/show.tsx
          git commit -m "Standardize weekly learning phases and column labels"
          git push origin main
