name: Patch Clear Weekly Content

on:
  push:
    paths:
      - '.github/scripts/patch-clear-weekly-content.py'
      - '.github/workflows/patch-clear-weekly-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch-clear-weekly-content.py

      - name: Verify patch
        run: |
          grep -q "weeks/clear-content" routes/web.php
          grep -q "public function clearWeeklyContent" app/Http/Controllers/RpsAutomationController.php
          grep -q "Kosongkan Isi Pekanan" resources/js/pages/rps/show.tsx
          php -l app/Http/Controllers/RpsAutomationController.php

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/web.php app/Http/Controllers/RpsAutomationController.php resources/js/pages/rps/show.tsx
          git commit -m "Add reset button for weekly RPS content"
          git push origin main
