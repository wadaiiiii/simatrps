name: Hide weekly utility buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-weekly-utility-buttons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide Waktu SKS and Pustaka buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('resources/js/pages/rps/show.tsx')
          s = p.read_text(encoding='utf-8')

          patterns = [
              r'\s*<button\b(?:(?!</button>).)*?/weeks/apply-time-standard(?:(?!</button>).)*?</button>',
              r'\s*<button\b(?:(?!</button>).)*?/weeks/normalize-references(?:(?!</button>).)*?</button>',
          ]

          for pattern in patterns:
              s2, count = re.subn(pattern, '', s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one matching toolbar button, found {count}: {pattern}')
              s = s2

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          ! grep -q '/weeks/apply-time-standard' resources/js/pages/rps/show.tsx
          ! grep -q '/weeks/normalize-references' resources/js/pages/rps/show.tsx
          grep -q 'Atur Pertemuan' resources/js/pages/rps/show.tsx
          grep -q 'Lengkapi RPS Otomatis' resources/js/pages/rps/show.tsx
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/workflows/hide-weekly-utility-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx .github/workflows/hide-weekly-utility-buttons.yml
          git commit -m "Simplify RPS weekly toolbar"
          git push
