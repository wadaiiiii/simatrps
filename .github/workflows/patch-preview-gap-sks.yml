name: Patch Preview Gap and SKS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-preview-gap-sks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch preview gap and SKS reads
        run: |
          python3 -c "import base64; exec(base64.b64decode('').decode())"

      - name: Commit patch
        run: |
          git config user.name "SiMatRPS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add resources/js/components/app-sidebar-header.tsx app/Http/Controllers/RpsController.php
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Fix preview table gap and normalize SKS display"
          git push origin HEAD:main
