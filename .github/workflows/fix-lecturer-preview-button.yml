name: Fix Lecturer Preview Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore pre-sidebar-preview files and enable header preview for lecturers
        run: |
          git checkout dd7bb09f292895c02ecc7a2f07c8b408698b2637 -- \
            resources/js/components/app-sidebar.tsx \
            resources/js/pages/rps/index.tsx \
            resources/js/pages/rps/show.tsx \
            routes/web.php

          python - <<'PY'
          from pathlib import Path
          p = Path('resources/js/components/app-sidebar-header.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    const isAdmin = page.props.auth?.user?.role === 'admin';\n", "")
          s = s.replace("            {isAdmin && isRpsDetail && (", "            {isRpsDetail && (")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/app-sidebar.tsx resources/js/components/app-sidebar-header.tsx resources/js/pages/rps/index.tsx resources/js/pages/rps/show.tsx routes/web.php
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Show existing RPS preview action to lecturers"
          git push
