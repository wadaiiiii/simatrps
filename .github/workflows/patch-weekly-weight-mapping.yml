name: Patch mapped Sub-CPMK weekly weight distribution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-weekly-weight-mapping.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mapped Sub-CPMK weight patch
        run: python3 .github/scripts/patch_weekly_weight_mapping.py
      - name: Validate PHP syntax
        run: |
          php -l app/Services/Rps/RpsSmartDraftService.php
          php -l app/Services/Rps/ObeWorkspaceService.php
      - name: Validate markers
        run: |
          grep -q "Target bobot Sub-CPMK diturunkan dari pemetaan asesmen agregat" app/Services/Rps/RpsSmartDraftService.php
          grep -q "subBudgetAligned" app/Services/Rps/ObeWorkspaceService.php
          grep -q "kesesuaian bobot per Sub-CPMK" app/Services/Rps/ObeWorkspaceService.php
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/patch_weekly_weight_mapping.py
          rm -f .github/workflows/patch-weekly-weight-mapping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/Rps/RpsSmartDraftService.php \
                  app/Services/Rps/ObeWorkspaceService.php \
                  .github/scripts/patch_weekly_weight_mapping.py \
                  .github/workflows/patch-weekly-weight-mapping.yml
          git commit -m "Align weekly weights with Sub-CPMK assessment budgets"
          git push
