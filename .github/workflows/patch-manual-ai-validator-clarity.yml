name: Patch Manual AI Safety and Validator Clarity

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-manual-ai-validator-clarity.py'
      - '.github/workflows/patch-manual-ai-validator-clarity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-manual-ai-validator-clarity.py

      - name: Verify backend syntax and source markers
        run: |
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Services/Rps/ObeWorkspaceService.php
          grep -q "Asesmen manual/dosen tidak boleh ditimpa oleh AI" app/Http/Controllers/RpsAiController.php
          grep -q "Memeriksa hubungan asesmen, Sub-CPMK, bobot 14 pekan" app/Services/Rps/ObeWorkspaceService.php
          grep -q "check.hint" resources/js/pages/rps/show.tsx
          git diff --check

      - name: Commit functional patch first
        run: |
          if git diff --quiet -- app/Http/Controllers/RpsAiController.php app/Services/Rps/ObeWorkspaceService.php resources/js/pages/rps/show.tsx; then
            echo "No functional changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAiController.php app/Services/Rps/ObeWorkspaceService.php resources/js/pages/rps/show.tsx
          git commit -m "Protect manual assessments and clarify OBE validator"
          git push origin main

      - name: Verify frontend build
        run: |
          npm ci
          npm run build
