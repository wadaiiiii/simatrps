name: Apply assessment delete RTM cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-assessment-delete-rtm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_assessment_delete_rtm.py

      - name: Validate PHP syntax
        run: |
          php -l app/Http/Controllers/RpsAssessmentController.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Services/Rps/RpsAssessmentSyncService.php

      - name: Validate patch markers
        run: |
          grep -q "RTM terkait ikut dihapus" app/Http/Controllers/RpsAssessmentController.php
          grep -q "RTM auto stale" app/Services/Rps/RpsAssessmentSyncService.php
          grep -q "normalizeAssessmentLabel" app/Http/Controllers/RpsController.php

      - name: Frontend build
        env:
          VERCEL: '1'
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit implementation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAssessmentController.php app/Http/Controllers/RpsController.php app/Services/Rps/RpsAssessmentSyncService.php resources/js/pages/rps/show.tsx
          git rm .github/scripts/patch_assessment_delete_rtm.py
          git rm .github/workflows/apply-assessment-delete-rtm.yml
          git commit -m "Remove stale RTM when assessments are deleted"
          git push
