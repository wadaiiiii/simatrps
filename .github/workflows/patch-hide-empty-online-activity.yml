name: Patch Hide Empty Online Activity

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-hide-empty-online-activity.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-hide-empty-online-activity.py
      - name: Verify
        run: |
          grep -q "hasMeaningfulOnlineActivity" resources/js/pages/rps/show.tsx
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          git commit -m "Hide empty online activity in weekly RPS"
          git push origin HEAD:main
