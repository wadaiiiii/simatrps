name: Patch Weekly Scannable Activities

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-weekly-scannable-activities.py'
      - '.github/workflows/patch-weekly-scannable-activities.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply weekly scannable activity patch
        run: python .github/scripts/patch-weekly-scannable-activities.py
      - name: PHP syntax check
        run: php -l app/Http/Controllers/RpsAiController.php
      - name: Verify markers
        run: |
          grep -q "FORMAT SCANNABLE METODE DAN AKTIVITAS PEMBELAJARAN" app/Http/Controllers/RpsAiController.php
          grep -q "formatScannableLearningActivity" app/Http/Controllers/RpsAiController.php
          grep -q "Aktivitas Kelas:" resources/js/pages/rps/show.tsx
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/RpsAiController.php resources/js/pages/rps/show.tsx
          git commit -m "Make weekly AI learning activities scannable"
          git push origin HEAD:main
