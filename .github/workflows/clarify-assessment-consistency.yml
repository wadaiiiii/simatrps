name: Clarify assessment consistency validator

on:
  push:
    paths:
      - '.github/scripts/clarify-assessment-consistency.py'
      - '.github/workflows/clarify-assessment-consistency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/clarify-assessment-consistency.py
      - name: Validate PHP syntax
        run: php -l app/Services/Rps/ObeWorkspaceService.php
      - name: Validate markers
        run: |
          grep -q "'label' => 'Konsistensi Penilaian'" app/Services/Rps/ObeWorkspaceService.php
          grep -q "memiliki lebih dari satu bukti penilaian" app/Services/Rps/ObeWorkspaceService.php
      - name: Commit implementation and cleanup
        run: |
          rm .github/scripts/clarify-assessment-consistency.py
          rm .github/workflows/clarify-assessment-consistency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify assessment consistency validator messages"
          git push
