name: Patch material prefix UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-material-prefix-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        run: python3 .github/scripts/patch_material_prefix_ui.py
      - name: Validate patch
        run: grep -q "stripMaterialListPrefix" resources/js/pages/rps/show.tsx
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/patch_material_prefix_ui.py .github/workflows/patch-material-prefix-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx .github/scripts/patch_material_prefix_ui.py .github/workflows/patch-material-prefix-ui.yml
          git commit -m "Hide duplicated material list prefixes"
          git push
