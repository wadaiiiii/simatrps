name: Patch RPS Audit Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-rps-audit-fixes.py'
      - '.github/workflows/patch-rps-audit-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited RPS fixes
        run: python .github/scripts/patch-rps-audit-fixes.py
      - name: Verify PHP syntax
        run: |
          php -l app/Services/Rps/RpsAssessmentSyncService.php
          php -l app/Http/Controllers/RpsTaskController.php
          php -l app/Http/Controllers/RpsAiController.php
          php -l app/Services/Rps/RpsAiContextService.php
          php -l app/Http/Controllers/RpsDocumentController.php
          php -l app/Http/Controllers/RpsController.php
          php -l app/Services/Rps/ObeWorkspaceService.php
      - name: Verify markers
        run: |
          grep -q 'Bobot RTM/Asesmen' resources/js/pages/rps/show.tsx
          grep -q 'Distribusi bobot pekan' resources/js/pages/rps/show.tsx
          grep -q 'generated_due_week_fixes' app/Services/Rps/RpsAssessmentSyncService.php
          grep -q 'material_coverage' app/Services/Rps/ObeWorkspaceService.php
          grep -q 'concept_accuracy' app/Services/Rps/ObeWorkspaceService.php
          grep -q 'rps-print-rtm-heading' resources/css/app.css
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app resources
          git commit -m 'Repair audited RPS weights schedules references and print flow'
          git push origin main
