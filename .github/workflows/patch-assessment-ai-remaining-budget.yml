name: Patch Assessment AI Remaining Budget

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-assessment-ai-remaining-budget.py'
      - '.github/workflows/patch-assessment-ai-remaining-budget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and commit assessment AI review UI
        shell: bash
        run: |
          set +e
          python3 .github/scripts/patch-assessment-ai-remaining-budget.py > /tmp/ui-patch.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            {
              echo "Assessment AI review UI patch failed"
              echo
              cat /tmp/ui-patch.log
            } > .github/ui-patch-error.txt
            git add .github/ui-patch-error.txt
            git commit -m "Record assessment AI review UI patch error" || true
            git push origin main
            exit 0
          fi

          grep -q "Acuan Bobot Telaah AI" resources/js/pages/rps/show.tsx
          grep -q "Total setelah pilihan" resources/js/pages/rps/show.tsx
          grep -q "Rekomendasi RTM" resources/js/pages/rps/show.tsx
          grep -q "Menunggu review" resources/js/pages/rps/show.tsx
          git diff --check

          if git diff --quiet -- resources/js/pages/rps/show.tsx; then
            echo "No UI source changes to commit"
            exit 0
          fi

          git add resources/js/pages/rps/show.tsx
          git commit -m "Refine assessment AI recommendation review UI"
          git push origin main

# source-first-ui-trigger
