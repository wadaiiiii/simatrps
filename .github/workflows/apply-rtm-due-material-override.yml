name: Apply RTM due week and material coverage patch

on:
  push:
    branches:
      - fix/rtm-due-week-material-coverage-override
    paths:
      - '.github/workflows/apply-rtm-due-material-override.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rtm-due-week-material-coverage-override
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new, 1))

          # 1) Generated/AI RTM due week must move both forward and backward
          # when Detail Asesmen changes, while never preceding the latest
          # teaching week of its Sub-CPMK coverage.
          sync_path = 'app/Services/Rps/RpsAssessmentSyncService.php'
          old = '''    private function repairGeneratedTaskDueWeeks(string $versionId): int
    {
        $tasks = DB::table('rps_tasks')
            ->where('rps_version_id', $versionId)
            ->get(['id', 'due_week', 'source_type', 'purpose', 'instructions', 'expected_output'])
            ->filter(fn ($task) => $this->isGeneratedTask($task))
            ->values();

        if ($tasks->isEmpty()) return 0;

        $taskLinks = DB::table('rps_task_subcpmks')
            ->whereIn('rps_task_id', $tasks->pluck('id')->all())
            ->get(['rps_task_id', 'rps_sub_cpmk_id'])
            ->groupBy('rps_task_id');

        $weeks = DB::table('rps_weekly_plans')
            ->where('rps_version_id', $versionId)
            ->whereIn('week_number', self::TEACHING_WEEKS)
            ->whereNotNull('rps_sub_cpmk_id')
            ->get(['week_number', 'rps_sub_cpmk_id']);

        $fixed = 0;
        foreach ($tasks as $task) {
            $subIds = collect($taskLinks->get($task->id, []))
                ->pluck('rps_sub_cpmk_id')->map('strval')->unique()->values();
            if ($subIds->isEmpty()) continue;

            $latest = $weeks
                ->filter(fn ($week) => $subIds->contains((string) $week->rps_sub_cpmk_id))
                ->max('week_number');
            $latest = $latest ? (int) $latest : 0;
            if ($latest <= 0) continue;

            $current = (int) ($task->due_week ?? 0);
            if ($current >= $latest) continue;

            DB::table('rps_tasks')->where('id', $task->id)->update([
                'due_week' => $latest,
                'updated_at' => now(),
            ]);
            $fixed++;
        }

        return $fixed;
    }
'''
          new = '''    private function repairGeneratedTaskDueWeeks(string $versionId): int
    {
        $tasks = DB::table('rps_tasks')
            ->where('rps_version_id', $versionId)
            ->get(['id', 'assessment_id', 'due_week', 'source_type', 'purpose', 'instructions', 'expected_output'])
            ->filter(fn ($task) => $this->isGeneratedTask($task))
            ->values();

        if ($tasks->isEmpty()) return 0;

        $assessmentWeeks = DB::table('assessments')
            ->where('rps_version_id', $versionId)
            ->whereIn('id', $tasks->pluck('assessment_id')->filter()->all())
            ->pluck('week_number', 'id');

        $taskLinks = DB::table('rps_task_subcpmks')
            ->whereIn('rps_task_id', $tasks->pluck('id')->all())
            ->get(['rps_task_id', 'rps_sub_cpmk_id'])
            ->groupBy('rps_task_id');

        $weeks = DB::table('rps_weekly_plans')
            ->where('rps_version_id', $versionId)
            ->whereIn('week_number', self::TEACHING_WEEKS)
            ->whereNotNull('rps_sub_cpmk_id')
            ->get(['week_number', 'rps_sub_cpmk_id']);

        $fixed = 0;
        foreach ($tasks as $task) {
            $subIds = collect($taskLinks->get($task->id, []))
                ->pluck('rps_sub_cpmk_id')->map('strval')->unique()->values();
            if ($subIds->isEmpty()) continue;

            $latest = $weeks
                ->filter(fn ($week) => $subIds->contains((string) $week->rps_sub_cpmk_id))
                ->max('week_number');
            $latest = $latest ? (int) $latest : 0;

            $assessmentWeek = filled($task->assessment_id ?? null)
                ? (int) ($assessmentWeeks->get((string) $task->assessment_id) ?? 0)
                : 0;
            $assessmentWeek = $assessmentWeek >= 1 && $assessmentWeek <= 16
                ? $assessmentWeek
                : 0;

            // Detail Asesmen adalah sumber utama jadwal RTM. Namun RTM tidak
            // boleh dikumpulkan sebelum pekan terakhir cakupan Sub-CPMK-nya.
            // Berbeda dari implementasi lama, target boleh bergerak mundur
            // saat asesmen diubah dari pekan yang lebih akhir ke lebih awal.
            $target = max($latest, $assessmentWeek);
            if ($target <= 0) continue;

            $current = (int) ($task->due_week ?? 0);
            if ($current === $target) continue;

            DB::table('rps_tasks')->where('id', $task->id)->update([
                'due_week' => $target,
                'updated_at' => now(),
            ]);
            $fixed++;
        }

        return $fixed;
    }
