                                                                                : 'Hubungan RTM dipertahankan sebagai keputusan dosen.',
'''
          new = '''                                                                    decisionCount > 1
                                                                        ? `${decisionCount} keputusan dosen dipertahankan sekaligus.`
                                                                        : check.key === 'assessment_semantics'
                                                                            ? 'Tag Sub-CPMK dipertahankan sebagai keputusan dosen.'
                                                                            : check.key === 'weekly_material_semantics'
                                                                                ? 'Materi pekan dipertahankan. Rekomendasi kesesuaian materi tidak diikuti.'
                                                                                : check.key === 'material_coverage'
                                                                                    ? 'Cakupan Bahan Kajian dipertahankan. Rekomendasi kedekatan semantik tidak diikuti.'
                                                                                    : 'Hubungan RTM dipertahankan sebagai keputusan dosen.',
'''
          replace_once(ui_path, old, new)

          old = '''                                                            if (check.key === 'weekly_material_semantics') {
                                                                return count > 1
                                                                    ? `Lanjut Semua (${count})`
                                                                    : 'Lanjut (Tidak Ikut Rekomendasi)';
                                                            }
'''
          new = '''                                                            if (['weekly_material_semantics', 'material_coverage'].includes(check.key)) {
                                                                return count > 1
                                                                    ? `Lanjut Semua (${count})`
                                                                    : 'Lanjut (Tidak Ikut Rekomendasi)';
                                                            }
'''
          replace_once(ui_path, old, new)

          # 4) Regression tests for backward due-week synchronization and
          # material coverage lecturer override.
          test_path = 'tests/Feature/RpsTaskSyncTest.php'
          text = Path(test_path).read_text()
          import_line = "use App\\Services\\Rps\\ObeWorkspaceService;\n"
          if import_line not in text:
              text = text.replace("use App\\Models\\User;\n", "use App\\Models\\User;\n" + import_line, 1)

          appendix = r'''

test('generated RTM due week moves backward when Detail Asesmen is moved earlier', function () {
    $lecturer = User::factory()->create(['role' => 'dosen', 'is_active' => true]);
    $fixture = createRpsTaskSyncFixture($lecturer);
    $assessmentId = insertAssessmentForRtm($fixture, $lecturer, 'Tugas Terstruktur 1', 6, 5, $fixture['sub1']);
    $taskId = (string) Str::uuid();

    DB::table('rps_tasks')->insert([
        'id' => $taskId,
        'rps_version_id' => $fixture['versionId'],
        'assessment_id' => $assessmentId,
        'code' => 'RTM-03',
        'title' => 'Tugas Terstruktur 1',
        'type' => 'assignment',
        'purpose' => 'Mengukur ketercapaian Sub-CPMK melalui Tugas Terstruktur 1.',
        'instructions' => 'Kerjakan Tugas Terstruktur 1 sesuai arahan dosen dan kriteria penilaian yang ditetapkan.',
        'expected_output' => 'Luaran Tugas Terstruktur 1 sesuai ketentuan asesmen.',
        'due_week' => 6,
        'source_type' => 'assessment_sync',
        'created_by' => null,
        'created_at' => $fixture['timestamp'],
        'updated_at' => $fixture['timestamp'],
    ]);
    DB::table('rps_task_subcpmks')->insert([
