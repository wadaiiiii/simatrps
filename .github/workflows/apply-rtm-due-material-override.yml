'''
          replace_once(workspace_path, old, new)

          old = '''            [
                'key' => 'material_coverage',
                'label' => 'Cakupan Bahan Kajian',
                'severity' => 'advisory',
                'done' => $materialCoverageAligned,
                'message' => $materialCoverageAligned
                    ? 'Bahan Kajian memiliki keterkaitan minimum dengan seluruh Sub-CPMK.'
                    : (($issue = $materialCoverageIssues->first())
                        ? $issue['sub_cpmk_code'].' belum memiliki Bahan Kajian yang cukup dekat. Telaah/tambah Bahan Kajian sebelum menyusun pekan terkait.'
                        : 'Ada Sub-CPMK yang belum ditopang Bahan Kajian.'),
                'details' => ['issues' => $materialCoverageIssues->all()],
            ],
'''
          new = '''            [
                'key' => 'material_coverage',
                'label' => 'Cakupan Bahan Kajian',
                'severity' => 'advisory',
                'done' => $materialCoverageAligned,
                'message' => $materialCoverageAligned
                    ? ($confirmedMaterialCoverageCount > 0
                        ? 'Cakupan Bahan Kajian diterima · '.$confirmedMaterialCoverageCount.' keputusan dosen untuk melanjutkan tanpa mengikuti rekomendasi dipertahankan.'
                        : 'Bahan Kajian memiliki keterkaitan minimum dengan seluruh Sub-CPMK.')
                    : (($issue = $materialCoverageIssues->first())
                        ? $issue['sub_cpmk_code'].' belum memiliki Bahan Kajian yang cukup dekat. Dosen boleh melengkapi Bahan Kajian atau melanjutkan tanpa mengikuti rekomendasi.'
                        : 'Ada Sub-CPMK yang belum ditopang Bahan Kajian.'),
                'details' => [
                    'issues' => $materialCoverageIssues->all(),
                    'confirmed_count' => $confirmedMaterialCoverageCount,
                ],
            ],
'''
          replace_once(workspace_path, old, new)

          controller_path = 'app/Http/Controllers/RpsValidatorDecisionController.php'
          old = "            'check_key' => ['required', Rule::in(['assessment_semantics', 'rtm_semantics', 'weekly_material_semantics'])],\n"
          new = "            'check_key' => ['required', Rule::in(['assessment_semantics', 'rtm_semantics', 'weekly_material_semantics', 'material_coverage'])],\n"
          replace_once(controller_path, old, new)

          # 3) Expose the same lecturer-override action on the material coverage card.
          ui_path = 'resources/js/pages/rps/show.tsx'
          old = "                                                {['assessment_semantics', 'rtm_semantics', 'weekly_material_semantics'].includes(check.key) && safeList(check?.details?.issues).some((issue: any) => issue?.decision_key) && (\n"
          new = "                                                {['assessment_semantics', 'rtm_semantics', 'weekly_material_semantics', 'material_coverage'].includes(check.key) && safeList(check?.details?.issues).some((issue: any) => issue?.decision_key) && (\n"
          replace_once(ui_path, old, new)

          old = '''                                                                    decisionCount > 1
                                                                        ? `${decisionCount} keputusan dosen dipertahankan sekaligus.`
                                                                        : check.key === 'assessment_semantics'
                                                                            ? 'Tag Sub-CPMK dipertahankan sebagai keputusan dosen.'
                                                                            : check.key === 'weekly_material_semantics'
