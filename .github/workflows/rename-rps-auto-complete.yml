name: Rename RPS Auto Complete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update RPS auto-complete wording
        run: |
          python - <<'PY'
          from pathlib import Path

          show = Path('resources/js/pages/rps/show.tsx')
          s = show.read_text(encoding='utf-8')
          replacements = {
              'title="Mengisi otomatis bagian RPS yang masih kosong tanpa mengubah isian yang sudah ada."': 'title="Mengisi otomatis bagian RPS yang belum terisi berdasarkan CPMK, Sub-CPMK, bahan kajian, SKS, dan data RPS yang tersedia, tanpa menimpa isian yang sudah ada."',
              "actionOptions('Bagian RPS yang masih kosong berhasil dilengkapi tanpa mengubah isian yang sudah ada.')": "actionOptions('RPS berhasil dilengkapi otomatis pada bagian yang belum terisi tanpa mengubah isian yang sudah ada.')",
              'Lengkapi Bagian Kosong': 'Lengkapi RPS Otomatis',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'show.tsx target not found: {old}')
              s = s.replace(old, new, 1)
          show.write_text(s, encoding='utf-8')

          controller = Path('app/Http/Controllers/RpsAutomationController.php')
          c = controller.read_text(encoding='utf-8')
          old_error = "'smart_draft' => 'Isi Kosong belum berhasil diproses. Coba ulangi setelah halaman dimuat ulang. Jika tetap terjadi, gunakan AI per pekan sementara proses otomatis diperiksa.',"
          new_error = "'smart_draft' => 'RPS belum berhasil dilengkapi otomatis. Muat ulang halaman lalu coba kembali. Jika masih gagal, gunakan AI per pekan sementara proses otomatis diperiksa.',"
          if old_error not in c:
              raise SystemExit('controller error target not found')
          c = c.replace(old_error, new_error, 1)

          old_success = '"Smart Draft selesai. {$result[\'updated_weeks\']} pertemuan diperbarui."'
          new_success = '"RPS berhasil dilengkapi otomatis. {$result[\'updated_weeks\']} pertemuan diperbarui."'
          if old_success not in c:
              raise SystemExit('controller success target not found')
          c = c.replace(old_success, new_success, 1)
          controller.write_text(c, encoding='utf-8')
          PY

      - name: Commit wording update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx app/Http/Controllers/RpsAutomationController.php
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Rename smart draft action to Lengkapi RPS Otomatis"
          git push
