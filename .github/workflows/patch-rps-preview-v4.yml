name: Patch RPS Preview V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rps-preview-v4.yml'

permissions:
  contents: write

jobs:
  patch-rps-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch preview behavior
        run: python3 -c "import base64; exec(base64.b64decode('').decode())"

      - name: Commit patch
        run: |
          if git diff --quiet -- resources/js/components/app-sidebar-header.tsx; then
            echo "No change required"
            exit 0
          fi
          git config user.name "SiMatRPS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add resources/js/components/app-sidebar-header.tsx
          git commit -m "Make RPS preview typography spacing and borders deterministic"
          git push origin HEAD:main
