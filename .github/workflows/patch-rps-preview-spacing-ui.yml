name: Patch RPS Preview Spacing UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rps-preview-spacing-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch-rps-preview-spacing-ui.py

      - name: Verify focused changes
        run: |
          grep -n "AI aktif\|Lengkapi Bagian Kosong\|Spacer nyata" resources/js/pages/rps/show.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix RPS preview spacing and clarify toolbar labels"
            git push origin HEAD:main
          fi
