name: Patch Sub-CPMK Auto Renumber

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: |
          python3 .github/scripts/patch_subcpmk_auto_renumber.py
          php -l app/Http/Controllers/ObeWorkspaceController.php

      - name: Commit implementation and cleanup
        run: |
          rm -f .github/scripts/patch_subcpmk_auto_renumber.py
          rm -f .github/workflows/patch-subcpmk-auto-renumber.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto renumber Sub-CPMK after deletion"
          git push
