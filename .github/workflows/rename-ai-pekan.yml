name: Rename AI week action
on:
  push:
    paths:
      - '.github/workflows/rename-ai-pekan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename label and tooltip
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('resources/js/pages/rps/show.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('title="Buat rekomendasi AI khusus untuk pekan ini"', 'title="Susun rekomendasi AI untuk pekan ini"')
          s = s.replace("{aiBusy ? 'AI...' : '✨ AI Pekan'}", "{aiBusy ? 'AI...' : '✨ Susun AI'}")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit implementation and cleanup
        run: |
          rm .github/workflows/rename-ai-pekan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx .github/workflows/rename-ai-pekan.yml
          git commit -m "Rename weekly AI action to Susun AI"
          git push
