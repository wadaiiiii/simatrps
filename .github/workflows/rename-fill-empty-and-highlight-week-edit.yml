name: Rename fill empty and highlight week edit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-fill-empty-and-highlight-week-edit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RPS action labels and week edit style
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('resources/js/pages/rps/show.tsx')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  'title="Mengisi otomatis bagian RPS yang belum terisi berdasarkan CPMK, Sub-CPMK, bahan kajian, SKS, dan data RPS yang tersedia, tanpa menimpa isian yang sudah ada."',
                  'title="Mengisi bagian RPS yang masih kosong dan menyegarkan isian otomatis tanpa menimpa edit manual atau hasil Susun AI."'
              ),
              (
                  "actionOptions('RPS berhasil dilengkapi otomatis pada bagian yang belum terisi tanpa mengubah isian yang sudah ada.'),",
                  "actionOptions('Bagian RPS yang masih kosong berhasil diisi tanpa menimpa edit manual atau hasil Susun AI.'),"
              ),
              ('Lengkapi RPS Otomatis', 'Isi Bagian Kosong'),
              (
                  'className="inline-flex items-center justify-center gap-1 rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-[10px] font-bold text-slate-600"',
                  'className="inline-flex items-center justify-center gap-1 rounded-lg border border-sky-700 bg-sky-600 px-2.5 py-1.5 text-[10px] font-extrabold text-white shadow-sm transition hover:bg-sky-700"'
              ),
              ('<Pencil className="size-3.5" /> Edit', '<Pencil className="size-3.5" /> Edit Pekan'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'target not found: {old[:80]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q "Isi Bagian Kosong" resources/js/pages/rps/show.tsx
          grep -q "Edit Pekan" resources/js/pages/rps/show.tsx
          grep -q "bg-sky-600" resources/js/pages/rps/show.tsx
          if grep -q "Lengkapi RPS Otomatis" resources/js/pages/rps/show.tsx; then
            echo "Old label still exists"
            exit 1
          fi
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/workflows/rename-fill-empty-and-highlight-week-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/rps/show.tsx .github/workflows/rename-fill-empty-and-highlight-week-edit.yml
          git commit -m "Clarify fill-empty action and highlight weekly editing"
          git push
